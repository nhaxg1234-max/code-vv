<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Heart - Trái Tim Thiên Hà</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020208;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .card-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(15, 8, 28, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 105, 180, 0.5);
            border-radius: 24px;
            padding: 40px 35px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 20, 147, 0.5);
            transition: all 0.6s ease;
        }

        .card-container.hide {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .card-title {
            font-size: 2.2rem;
            margin-bottom: 12px;
            background: linear-gradient(45deg, #ff71ce, #01cdfe, #b572e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .card-subtitle {
            font-size: 0.95rem;
            color: #d8b4fe;
            margin-bottom: 28px;
        }

        .btn-start {
            padding: 14px 40px;
            font-size: 1.05rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff2a70, #7c4dff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 42, 112, 0.6);
            transition: all 0.3s ease;
        }

        .btn-start:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 42, 112, 0.9);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="tim-e.mp3" type="audio/mpeg">
        <source src="tim-e" type="audio/mpeg">
    </audio>

    <div id="canvas-container"></div>

    <div class="card-container" id="welcomeCard">
        <h1 class="card-title">NOEL LÀM NÈ</h1>
        <p class="card-subtitle">LÀ NOEL ĐÓ ✨</p>
        <button class="btn-start" id="btnStart">INICIAR</button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let scene, camera, renderer, controls;
            let galaxyPoints, heartPoints, textGroup;
            let started = false;

            function initThree() {
                const container = document.getElementById('canvas-container');

                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 12, 28);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                if (typeof THREE.OrbitControls !== 'undefined') {
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                }

                createGalaxy();
                createHeart();
                createFloatingTexts();

                window.addEventListener('resize', onWindowResize);
                animate();
            }

            function createGalaxy() {
                const count = 18000;
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const colorInside = new THREE.Color('#ff2b9c');
                const colorOutside = new THREE.Color('#3a86ff');

                for (let i = 0; i < count; i++) {
                    const r = Math.random() * 16;
                    const arms = 3;
                    const theta = (i % arms) * ((2 * Math.PI) / arms) + r * 0.35;

                    positions[i * 3] = Math.cos(theta) * r + (Math.random() - 0.5) * 0.4 * r;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 0.2 * (16 - r);
                    positions[i * 3 + 2] = Math.sin(theta) * r + (Math.random() - 0.5) * 0.4 * r;

                    const mixedColor = colorInside.clone().lerp(colorOutside, r / 16);
                    colors[i * 3] = mixedColor.r;
                    colors[i * 3 + 1] = mixedColor.g;
                    colors[i * 3 + 2] = mixedColor.b;
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.15,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });

                galaxyPoints = new THREE.Points(geo, mat);
                scene.add(galaxyPoints);
            }

            function createHeart() {
                const count = 8000;
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    const t = Math.random() * Math.PI * 2;
                    const u = (Math.random() - 0.5) * Math.PI;

                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    let z = u * 4;

                    const scale = 0.32;
                    positions[i * 3] = x * scale;
                    positions[i * 3 + 1] = y * scale + 5;
                    positions[i * 3 + 2] = z * scale;

                    colors[i * 3] = 1;
                    colors[i * 3 + 1] = 0.2;
                    colors[i * 3 + 2] = 0.7;
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.2,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending
                });

                heartPoints = new THREE.Points(geo, mat);
                scene.add(heartPoints);
            }

            function createTextSprite(text, color) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 128;
                ctx.font = 'Bold 44px Arial';
                ctx.fillStyle = color;
                ctx.textAlign = 'center';
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
                ctx.fillText(text, 256, 64);

                const texture = new THREE.CanvasTexture(canvas);
                const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(10, 2.5, 1);
                return sprite;
            }

            function createFloatingTexts() {
                textGroup = new THREE.Group();
                const items = [
                    { t: "MI CORAZÓN ES TUYO", x: 0, y: -1, z: 10, c: "#ff007f" },
                    { t: "CONTIGO SIEMPRE", x: 9, y: 1, z: 2, c: "#ff00aa" },
                    { t: "INFINITO", x: -10, y: 0.5, z: -2, c: "#00d4ff" },
                    { t: "TE AMO ❤️", x: 6, y: -1, z: -8, c: "#ff3366" }
                ];
                items.forEach(item => {
                    const s = createTextSprite(item.t, item.c);
                    s.position.set(item.x, item.y, item.z);
                    textGroup.add(s);
                });
                scene.add(textGroup);
            }

            function animate() {
                requestAnimationFrame(animate);
                const time = Date.now() * 0.001;

                if (galaxyPoints) galaxyPoints.rotation.y = time * 0.1;
                if (textGroup) textGroup.rotation.y = time * 0.05;

                if (heartPoints && started) {
                    heartPoints.rotation.y = time * 0.2;
                    if (heartPoints.material.opacity < 1) {
                        heartPoints.material.opacity += 0.02;
                    }
                }

                if (controls) controls.update();
                renderer.render(scene, camera);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // BẮT SỰ KIỆN CLICK NÚT AN TOÀN
            const btn = document.getElementById('btnStart');
            btn.addEventListener('click', () => {
                document.getElementById('welcomeCard').classList.add('hide');
                started = true;
                const music = document.getElementById('bgMusic');
                if (music) music.play().catch(() => {});
            });

            initThree();
        });
    </script>
</body>
</html>
